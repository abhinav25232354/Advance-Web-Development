<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float-Clear</title>
</head>
<style>
    #card{
        border: 2px solid black;
        display: flow-root;
    }
    #card p{
        padding: 20px;
        padding-left: 50px;
        clear: right;
        /* It removes float in the right if any (clear:both)*/
    }
    /* #card:nth-child(1) Index starts from 0 as always*/ 
    img{
        width: 230px;
        float: left; 
        /* Can be right also, Image will flow in right and allow the text to flow in the left and same for other */
    }
</style>
<body>
    <div id="card">
        <img src="image.jpg" alt="An Image">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Incidunt corporis eveniet reprehenderit perspiciatis soluta nostrum dolores possimus, illo, laborum maiores eum ut, laudantium provident autem ipsum mollitia modi. Tempore, esse cupiditate? Provident, mollitia consequuntur.</p>
    </div>
</body>
</html>
